<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f7a55">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Calories">
  <title>Daily Calories</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <div id="sheet-root"></div>
  <div id="toast" role="status" hidden></div>

  <!-- Hidden inputs: one opens the camera directly, one opens the photo library. -->
  <input id="camera-input" type="file" accept="image/*" capture="environment" hidden>
  <input id="gallery-input" type="file" accept="image/*" hidden>

  <script src="/app.js" type="module"></script>
</body>
</html>
